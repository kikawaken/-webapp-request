name: Azure Web App Request

on:
  workflow_dispatch:
    inputs:

      resource_group:
        description: "Resource Group name"
        required: true
        type: string

      location:
        description: "Azure region"
        required: true
        type: choice
        options:
          - japaneast
          - japanwest
          - eastus
          - eastus2
          - westus2
          - southeastasia

      app_service_plan:
        description: "App Service Plan name"
        required: true
        type: string

      webapp_name:
        description: "Web App name"
        required: true
        type: string

      runtime:
        description: "Runtime"
        required: true
        type: choice
        options:
          - "Python latest"
          - "Python 3.13"
          - "Python 3.12"
          - "Node.js latest"
          - "Node.js 22"
          - "Node.js 20"
          - ".NET latest"
          - ".NET 8.0"
          - "Java latest"
          - "Java 21"
          - "Java 17"

      os:
        description: "Operating System"
        required: true
        type: choice
        options:
          - Linux
          - Windows

      sku:
        description: "App Service Plan SKU"
        required: true
        type: choice
        options:
          - B1
          - B2
          - S1
          - P1v3

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PROD

      https_only:
        description: "HTTPS Only"
        required: true
        type: choice
        options:
          - "true"
          - "false"

      managed_identity:
        description: "Managed Identity"
        required: true
        type: choice
        options:
          - "true"
          - "false"

      public_network_access:
        description: "Public Network Access"
        required: true
        type: choice
        options:
          - "true"
          - "false"

      application_insights:
        description: "Application Insights"
        required: true
        type: choice
        options:
          - "true"
          - "false"


permissions:
  contents: read


jobs:

  # ==========================================================
  # Validate
  # ==========================================================
  validate:
    name: Validate Request
    runs-on: ubuntu-latest

    steps:

      - name: Show parameters
        run: |
          echo "=========================================="
          echo "Azure Web App Request"
          echo "=========================================="
          echo "Requested by          : ${{ github.actor }}"
          echo "Resource Group        : ${{ inputs.resource_group }}"
          echo "Location              : ${{ inputs.location }}"
          echo "App Service Plan      : ${{ inputs.app_service_plan }}"
          echo "Web App               : ${{ inputs.webapp_name }}"
          echo "Runtime               : ${{ inputs.runtime }}"
          echo "OS                    : ${{ inputs.os }}"
          echo "SKU                   : ${{ inputs.sku }}"
          echo "Environment           : ${{ inputs.environment }}"
          echo "HTTPS Only            : ${{ inputs.https_only }}"
          echo "Managed Identity      : ${{ inputs.managed_identity }}"
          echo "Public Network Access: ${{ inputs.public_network_access }}"
          echo "Application Insights : ${{ inputs.application_insights }}"
          echo "=========================================="

      - name: Validate
        shell: bash
        run: |

          ERRORS=()

          WEBAPP="${{ inputs.webapp_name }}"
          RG="${{ inputs.resource_group }}"
          PLAN="${{ inputs.app_service_plan }}"
          RUNTIME="${{ inputs.runtime }}"
          OS="${{ inputs.os }}"
          ENV="${{ inputs.environment }}"
          HTTPS="${{ inputs.https_only }}"
          MI="${{ inputs.managed_identity }}"

          # Web App name
          if [[ ! "$WEBAPP" =~ ^[a-z0-9-]+$ ]]; then
            ERRORS+=("Web App name must contain only lowercase letters, numbers and hyphens.")
          fi

          if [ ${#WEBAPP} -gt 60 ]; then
            ERRORS+=("Web App name must be 60 characters or less.")
          fi

          # Resource Group
          if [[ ! "$RG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            ERRORS+=("Resource Group name contains invalid characters.")
          fi

          # App Service Plan
          if [[ ! "$PLAN" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            ERRORS+=("App Service Plan name contains invalid characters.")
          fi

          # Python
          if [[ "$RUNTIME" == Python* && "$OS" != "Linux" ]]; then
            ERRORS+=("Python runtime requires Linux.")
          fi

          # PROD
          if [[ "$ENV" == "PROD" ]]; then

            if [[ "$HTTPS" != "true" ]]; then
              ERRORS+=("PROD requires HTTPS Only=true.")
            fi

            if [[ "$MI" != "true" ]]; then
              ERRORS+=("PROD requires Managed Identity=true.")
            fi

          fi

          if [ ${#ERRORS[@]} -gt 0 ]; then

            echo ""
            echo "Validation failed:"
            printf ' - %s\n' "${ERRORS[@]}"

            exit 1
          fi

          echo "Validation succeeded."


  # ==========================================================
  # Create request Issue in PRIVATE repository
  # ==========================================================
  create-private-issue:
    name: Create Private Approval Issue
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ISSUE_TOKEN }}
        run: |

          cat > request.md <<'EOF'
          ## Azure Web App Provisioning Request

          このIssueはPublic Repositoryから自動作成された申請です。

          **Azure操作は承認後にPrivate Repository側で実行されます。**

          ---

          ### Request Information

          | Parameter | Value |
          |---|---|
          | Requester | ${{ github.actor }} |
          | Public Repository | ${{ github.repository }} |
          | Public Run ID | ${{ github.run_id }} |
          | Resource Group | ${{ inputs.resource_group }} |
          | Location | ${{ inputs.location }} |
          | App Service Plan | ${{ inputs.app_service_plan }} |
          | Web App | ${{ inputs.webapp_name }} |
          | Runtime | ${{ inputs.runtime }} |
          | OS | ${{ inputs.os }} |
          | SKU | ${{ inputs.sku }} |
          | Environment | ${{ inputs.environment }} |
          | HTTPS Only | ${{ inputs.https_only }} |
          | Managed Identity | ${{ inputs.managed_identity }} |
          | Public Network Access | ${{ inputs.public_network_access }} |
          | Application Insights | ${{ inputs.application_insights }} |

          ---

          ### Approval

          承認者はこのIssueを確認してください。

          承認する場合:

          `/approve`

          却下する場合:

          `/reject`

          **承認者以外の `/approve` は無効です。**

          ---

          <!--
          AZURE_WEBAPP_REQUEST_V1
          REQUESTER=${{ github.actor }}
          PUBLIC_REPOSITORY=${{ github.repository }}
          PUBLIC_RUN_ID=${{ github.run_id }}
          RESOURCE_GROUP=${{ inputs.resource_group }}
          LOCATION=${{ inputs.location }}
          APP_SERVICE_PLAN=${{ inputs.app_service_plan }}
          WEBAPP_NAME=${{ inputs.webapp_name }}
          RUNTIME=${{ inputs.runtime }}
          OS=${{ inputs.os }}
          SKU=${{ inputs.sku }}
          ENVIRONMENT=${{ inputs.environment }}
          HTTPS_ONLY=${{ inputs.https_only }}
          MANAGED_IDENTITY=${{ inputs.managed_identity }}
          PUBLIC_NETWORK_ACCESS=${{ inputs.public_network_access }}
          APPLICATION_INSIGHTS=${{ inputs.application_insights }}
          -->

          EOF

          gh issue create \
            --repo kikawaken/create-webapp \
            --title "Azure Web App Approval - ${{ inputs.webapp_name }} - Run ${{ github.run_id }}" \
            --body-file request.md
